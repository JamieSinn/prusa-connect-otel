# A project of its own; without this pnpm joins a workspace further up.
packages:
  - .

savePrefix: ''
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

# The @prusa packages aren't on npm yet, so they come from the .core
# submodule. Delete this block once they are published.
overrides:
  '@prusa/connect': 'link:../.core/packages/typescript'
  '@prusa/connect-ui': 'link:../.core/packages/svelte'
  '@prusa/frontend-standards': 'file:../.core/packages/standards'

autoInstallPeers: false

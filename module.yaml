name: otel-exporter
kind: sink
# release-please bumps the version between these markers.
# x-release-please-start-version
version: 0.1.2
# x-release-please-end
license: MIT
title: OpenTelemetry exporter
summary: Exports printer telemetry as OTLP metrics and finished prints as spans.
codeowner: Jamie Sinn
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64
require:
  core: '>=0.1.0-beta.1'
  core-device.list: '*'
  core-device.get: '*'
permissions:
  - observe
egress:
  - option: otlp_endpoint
    ports:
      - 443
      - 4317
      - 4318
    why: Sends metrics and print spans to the configured OTLP collector.
    sends: >-
      Telemetry values with each printer's id, name, vendor and model, and one
      span per finished print: file name, path, outcome, progress, print time
      and filament used.
needs:
  memory_mib: 64
ui:
  entry: ui/index.js
  library: '>=0.1.0 <1.0.0'
  contributes:
    settings:
      - id: status
        title: Export status
    device_section:
      - id: export
        title: OpenTelemetry
    cards:
      - id: export-health
        title: OpenTelemetry
        description: Export health for metrics and print spans.
        size:
          w: 4
          h: 3
        least:
          w: 3
          h: 2
options:
  - key: otlp_endpoint
    type: string
    required: true
    summary: >-
      Collector address, as host:port or a URL. A URL path is used as a prefix
      for /v1/metrics and /v1/traces. https:// uses TLS, http:// does not.
  - key: otlp_protocol
    type: string
    default: http/protobuf
    summary: http/protobuf or grpc. gRPC ignores the URL path.
  - key: otlp_headers
    type: secret
    summary: >-
      Extra request headers as comma-separated key=value pairs, e.g.
      Authorization=Bearer <token>.
  - key: otlp_insecure
    type: bool
    default: 'false'
    summary: >-
      Disable TLS when otlp_endpoint has no scheme. Ignored if the endpoint has
      a scheme.
  - key: otlp_tls_skip_verify
    type: bool
    default: 'false'
    summary: Skip certificate verification, e.g. for a self-signed collector.
  - key: service_name
    type: string
    default: prusa-connect-otel
    summary: The service.name resource attribute.
  - key: export_interval
    type: duration
    default: 10s
    summary: How often metrics are exported.
  - key: metric_prefix
    type: string
    default: prusa.connect
    summary: >-
      Prefix for metric names. /tools/0/nozzle_temp becomes
      <prefix>.tools.nozzle_temp.

version: "2"

formatters:
  enable:
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/jamiesinn/connect-otel
    golines:
      max-len: 120

linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - gocritic
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - protogetter
    - revive
    - sloglint
    - spancheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        # stdout carries the wire protocol.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      strconcat: false
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-naming
    sloglint:
      no-global: all
      context: scope
    staticcheck:
      checks:
        - all
        - -ST1000 # package comment on every package
        - -ST1016 # receiver names
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # The SDK is built from the .core submodule until it is published.
      - path: go\.mod
        text: local replacement are not allowed
        linters: [gomoddirectives]
      - text: exported \S+ \S+ should have comment
        linters: [revive]
      - path: _test\.go
        linters: [bodyclose, errcheck, gosec, noctx]

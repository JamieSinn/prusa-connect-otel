name: Release

# release-please maintains a release PR. Merging it creates the release, and
# the publish job sends that commit to the Prusa Plugin Marketplace builder.
#
# Publishing runs here rather than on `release: published` because releases
# created with GITHUB_TOKEN don't trigger other workflows.
#
# The marketplace trusts uploads from this file in the `release` environment.
# Renaming either breaks publishing. Setup: README.md, "Publishing setup".

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@v1
    with:
      path: .
      core-ref: v0.1.0-beta.1 # must match the .core submodule
      bundle-command: make ui-build
      # This run isn't triggered by a release event, so pass the notes.
      changelog: ${{ needs.release-please.outputs.body }}
    # Must be passed by name; `secrets: inherit` doesn't cross organisations.
    secrets:
      PRUSA_CONNECT_EXTENSION_SIGNING_KEY: ${{ secrets.PRUSA_CONNECT_EXTENSION_SIGNING_KEY }}
    permissions:
      contents: read
      id-token: write
      attestations: write

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true
      - run: scripts/check-core-pin.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check

  # Same build and checks as a release, signed with a throwaway key and not
  # uploaded.
  build:
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@v1
    with:
      path: .
      core-ref: v0.1.0-beta.1 # must match the .core submodule
      dry-run: true
    permissions:
      contents: read
      id-token: write
      attestations: write
